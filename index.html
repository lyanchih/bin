<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bin Projects Dashboard</title>
  <style>
    :root {
      --bg: #0b0f17;
      --surface: #131a27;
      --surface-hover: #1a2436;
      --surface-active: #1e293b;
      --border: #263248;
      --border-highlight: #3b82f6;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-soft: rgba(59, 130, 246, 0.14);
      --green: #10b981;
      --green-soft: rgba(16, 185, 129, 0.14);
      --purple: #a855f7;
      --radius: 12px;
      --mono: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at top, #131c2e 0%, var(--bg) 55%);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      line-height: 1.6;
      padding: 2.5rem 1.25rem 4rem;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
      display: grid;
      place-items: center;
      font-family: var(--mono);
      font-weight: 700;
      font-size: 1.15rem;
      color: #fff;
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
    }

    .brand h1 {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand p {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .search-box {
      position: relative;
      min-width: 240px;
      flex: 0 1 300px;
    }

    .search-box input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.6rem 0.9rem;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .project-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }

    .project-card:hover {
      border-color: #364869;
    }

    .project-card.active {
      border-color: var(--border-highlight);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }

    .project-header {
      padding: 1.25rem 1.5rem;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      transition: background 0.15s ease;
    }

    .project-header:hover {
      background: var(--surface-hover);
    }

    .project-main {
      flex: 1;
    }

    .project-title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.45rem;
    }

    .project-id {
      font-family: var(--mono);
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
    }

    .project-title {
      font-size: 1rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .badge {
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .project-summary {
      color: var(--text-muted);
      font-size: 0.925rem;
      margin-bottom: 0.7rem;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .tag {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.1rem 0.45rem;
      border-radius: 6px;
    }

    .expand-indicator {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.82rem;
      color: var(--text-muted);
      font-family: var(--mono);
      padding: 0.35rem 0.65rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      white-space: nowrap;
      margin-top: 0.1rem;
    }

    .chevron {
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .project-card.active .chevron {
      transform: rotate(180deg);
    }

    .project-details {
      display: none;
      padding: 0 1.5rem 1.5rem;
      border-top: 1px solid var(--border);
      background: rgba(11, 15, 23, 0.45);
    }

    .project-card.active .project-details {
      display: block;
    }

    .section-label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin: 1.2rem 0 0.65rem;
    }

    .binary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 0.85rem;
    }

    .bin-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.8rem;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .bin-card:hover {
      border-color: var(--accent);
      background: var(--surface-hover);
    }

    .bin-download-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .bin-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.35rem;
    }

    .bin-name {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 1rem;
      color: #60a5fa;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .bin-size {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: #34d399;
      background: var(--green-soft);
      padding: 0.12rem 0.5rem;
      border-radius: 999px;
    }

    .bin-meta {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .bin-note {
      font-size: 0.83rem;
      color: #cbd5e1;
    }

    .bin-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding-top: 0.55rem;
      border-top: 1px dashed var(--border);
    }

    .btn-download {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 600;
      padding: 0.48rem 0.85rem;
      border-radius: 7px;
      transition: background 0.15s ease;
    }

    .btn-download:hover {
      background: var(--accent-hover);
    }

    .btn-copy {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 0.78rem;
      padding: 0.48rem 0.7rem;
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn-copy:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--text-muted);
    }

    .desc-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    .desc-list li::before {
      content: "•";
      color: var(--accent);
      font-weight: bold;
      display: inline-block;
      width: 1.1rem;
    }

    .code-block {
      background: #090d14;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      font-family: var(--mono);
      font-size: 0.82rem;
      color: #e2e8f0;
      overflow-x: auto;
      white-space: pre;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-icon">&gt;_</div>
        <div>
          <h1>Bin Projects Dashboard</h1>
          <p>點擊專案展開 Binary 清單，點選執行檔即可直接下載使用</p>
        </div>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜尋專案名稱、標籤或說明..." />
      </div>
    </header>

    <main id="projectList" class="project-list"></main>
  </div>

  <script>
    const FALLBACK_PROJECTS = [
      {
        id: "notify",
        name: "notify",
        title: "AI 訂閱額度監控與通知程序",
        language: "Rust",
        tags: ["Rust", "musl-static", "ntfy", "Claude", "Codex", "Antigravity"],
        summary: "定時抓取 Claude、Codex 與 Antigravity (Gemini) 訂閱額度，當已用額度跨越 80%、85%、90%、95% 門檻時自動推播美化通知至 ntfy (lyan-ai-quota)。",
        description: [
          "支援 Agent：Claude (5h / 7d)、Codex (5h / 7d)、Antigravity (Gemini 池)",
          "智慧去重：暫存檔紀錄抓取時間、剩餘量與刷新時間，同一刷新週期內每個門檻僅通知一次",
          "零外部執行期依賴：以 musl 完全靜態連結並內建純 Rust TLS (rustls-rustcrypto)，任何乾淨 Ubuntu / Linux 下載即可直接執行"
        ],
        usage: [
          "notify                # 預設每 5 分鐘檢查一次並常駐執行",
          "notify -i 10          # 指定每 10 分鐘檢查一次",
          "notify --once         # 單次抓取並更新暫存檔後結束",
          "notify --test-notify  # 立即發送一則測試通知至 ntfy"
        ],
        sourceDir: "notify/",
        binaries: [
          {
            name: "notify",
            arch: "x86_64 (amd64)",
            target: "x86_64-unknown-linux-musl",
            path: "bin/notify",
            downloadName: "notify",
            size: "2.3 MB",
            note: "Linux x86_64 完全靜態執行檔 (Static-PIE)"
          },
          {
            name: "notify-aarch64",
            arch: "ARM64 (aarch64)",
            target: "aarch64-unknown-linux-musl",
            path: "bin/notify-aarch64",
            downloadName: "notify-aarch64",
            size: "1.9 MB",
            note: "Linux ARM64 完全靜態執行檔 (Static)"
          }
        ]
      }
    ];

    let allProjects = [];
    let expandedIds = new Set();

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function buildCurlCmd(binPath, downloadName) {
      const url = new URL(binPath, window.location.href).href;
      return `curl -fsSL "${url}" -o ${downloadName} && chmod +x ${downloadName}`;
    }

    function renderProjects(filterText = "") {
      const container = document.getElementById("projectList");
      const q = filterText.trim().toLowerCase();

      const filtered = allProjects.filter((p) => {
        if (!q) return true;
        const haystack = [
          p.name,
          p.title,
          p.summary,
          ...(p.tags || []),
          ...(p.description || [])
        ]
          .join(" ")
          .toLowerCase();
        return haystack.includes(q);
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">找不到符合「${escapeHtml(filterText)}」的專案</div>`;
        return;
      }

      container.innerHTML = filtered
        .map((proj) => {
          const isOpen = expandedIds.has(proj.id);
          const binCount = (proj.binaries || []).length;

          const binsHtml = (proj.binaries || [])
            .map((b, idx) => {
              const btnId = `copy-${escapeHtml(proj.id)}-${idx}`;
              return `
                <div class="bin-card">
                  <a class="bin-download-link" href="${escapeHtml(b.path)}" download="${escapeHtml(b.downloadName || b.name)}">
                    <div class="bin-top">
                      <span class="bin-name">⬇ ${escapeHtml(b.name)}</span>
                      <span class="bin-size">${escapeHtml(b.size || "")}</span>
                    </div>
                    <div class="bin-meta">${escapeHtml(b.arch)} · ${escapeHtml(b.target)}</div>
                    <div class="bin-note">${escapeHtml(b.note || "")}</div>
                  </a>
                  <div class="bin-actions">
                    <a class="btn-download" href="${escapeHtml(b.path)}" download="${escapeHtml(b.downloadName || b.name)}">
                      直接下載 (${escapeHtml(b.name)})
                    </a>
                    <button
                      type="button"
                      class="btn-copy"
                      id="${btnId}"
                      data-path="${escapeHtml(b.path)}"
                      data-dl="${escapeHtml(b.downloadName || b.name)}"
                      title="複製 curl 下載並賦予執行權限指令"
                    >
                      複製 curl
                    </button>
                  </div>
                </div>
              `;
            })
            .join("");

          const descHtml =
            proj.description && proj.description.length
              ? `
                <div class="section-label">功能說明</div>
                <ul class="desc-list">
                  ${proj.description.map((d) => `<li>${escapeHtml(d)}</li>`).join("")}
                </ul>
              `
              : "";

          const usageHtml =
            proj.usage && proj.usage.length
              ? `
                <div class="section-label">使用範例</div>
                <div class="code-block">${escapeHtml(proj.usage.join("\n"))}</div>
              `
              : "";

          return `
            <section class="project-card ${isOpen ? "active" : ""}" data-id="${escapeHtml(proj.id)}">
              <div class="project-header" data-toggle="${escapeHtml(proj.id)}">
                <div class="project-main">
                  <div class="project-title-row">
                    <span class="project-id">${escapeHtml(proj.name)}</span>
                    <span class="project-title">— ${escapeHtml(proj.title)}</span>
                    <span class="badge">${escapeHtml(proj.language || "Binary")}</span>
                  </div>
                  <p class="project-summary">${escapeHtml(proj.summary)}</p>
                  <div class="tag-row">
                    ${(proj.tags || []).map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join("")}
                  </div>
                </div>
                <div class="expand-indicator">
                  <span>${binCount} 個執行檔</span>
                  <span class="chevron">▼</span>
                </div>
              </div>

              <div class="project-details">
                <div class="section-label">可下載執行檔 (點擊直接下載)</div>
                <div class="binary-grid">
                  ${binsHtml}
                </div>
                ${descHtml}
                ${usageHtml}
              </div>
            </section>
          `;
        })
        .join("");

      container.querySelectorAll("[data-toggle]").forEach((headerEl) => {
        headerEl.addEventListener("click", () => {
          const id = headerEl.getAttribute("data-toggle");
          if (expandedIds.has(id)) {
            expandedIds.delete(id);
          } else {
            expandedIds.add(id);
          }
          renderProjects(document.getElementById("searchInput").value);
        });
      });

      container.querySelectorAll(".btn-copy").forEach((btn) => {
        btn.addEventListener("click", async (e) => {
          e.stopPropagation();
          const path = btn.getAttribute("data-path");
          const dl = btn.getAttribute("data-dl");
          const cmd = buildCurlCmd(path, dl);
          try {
            await navigator.clipboard.writeText(cmd);
            const orig = btn.textContent;
            btn.textContent = "已複製 ✓";
            setTimeout(() => {
              btn.textContent = orig;
            }, 1500);
          } catch (_) {
            prompt("複製以下指令：", cmd);
          }
        });
      });
    }

    async function init() {
      try {
        const res = await fetch("./projects.json", { cache: "no-store" });
        if (res.ok) {
          allProjects = await res.json();
        } else {
          allProjects = FALLBACK_PROJECTS;
        }
      } catch (_) {
        allProjects = FALLBACK_PROJECTS;
      }

      renderProjects();

      document.getElementById("searchInput").addEventListener("input", (e) => {
        renderProjects(e.target.value);
      });
    }

    init();
  </script>
</body>
</html>
